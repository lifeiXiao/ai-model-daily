name: Daily AI models & Pages

on:
  schedule:
    # 00:17 UTC = 08:17 Asia/Shanghai. GitHub may delay scheduled runs.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "daily/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    outputs:
      generated_at: ${{ steps.catalog.outputs.generated_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test collection rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check browser script syntax
        run: node --check web/app.js
      - name: Collect public model metadata and announcements
        if: github.event_name != 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/update.py
      - name: Build static site
        run: python scripts/build.py
      - name: Record catalog version
        id: catalog
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("data/catalog.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("generated_at=" + data["generated_at"] + "\n")
          PY
      - name: Install browser test tools
        if: github.event_name != 'schedule'
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test desktop and mobile UI
        if: github.event_name != 'schedule'
        run: python tests/browser_smoke.py
      - name: Save UI screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit daily data and archive
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json daily/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily AI model catalog [skip ci]"
            git push
          fi
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.generated_at }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["PAGE_URL"].rstrip("/") + "/data/catalog.json"
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url + "?version=" + os.environ["GITHUB_RUN_ID"])
                  with urllib.request.urlopen(req, timeout=20) as res:
                      data = json.load(res)
                  assert data["generated_at"] == os.environ["EXPECTED_VERSION"], "Waiting for CDN refresh"
                  assert len(data["items"]) > 0
                  print("Verified published catalog:", len(data["items"]), "records")
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print("Waiting for Pages:", error)
                  time.sleep(10)
          PY
